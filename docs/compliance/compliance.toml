reason = "Implicit, both halves tested. Server (tests/processing_producer.rs): the runner answers one input with a run bracketed by RUN_STARTED/RUN_FINISHED carrying the input's threadId and runId, and the verifier for that input refuses another thread or a later run. Client (tests/processing_order.rs): an exchange is bracketed by the run lifecycle and an unbracketed stream is refused; a Thread's next run reuses its threadId, history and state (tests/interrupts_resume.rs). W4-rules-other."

