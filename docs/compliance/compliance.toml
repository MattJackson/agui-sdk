scope = "1.0"
fixtures = ["raw-and-custom-pass-through", "custom-closes-chunk-stream-fatal", "raw-does-not-close-chunk-stream"]
reason = "Implicit, both halves tested. Server: the runner sends RAW and CUSTOM as given inside the run (tests/passthrough_events.rs); the verifier keeps a chunk stream open across RAW and ends it at CUSTOM (tests/claims_producer.rs, producer fixture refuse-custom-closes-chunk-stream). Client: RAW and CUSTOM are standalone and change nothing (tests/passthrough_events.rs, corpus raw-*/custom-*)."
tie_break = "A3: a lane is an owner: the parent agent, or one `subagentRunId`. Each lane holds at most one pending chunk stream, of any kind. Explicit message, tool-call (including TOOL_CALL_RESULT), step, state, CUSTOM and reasoning events close their own lane. RUN_STARTED, RUN_FINISHED, RUN_ERROR and MESSAGES_SNAPSHOT close all lanes. SUBAGENT_FINISHED/ERROR close that subagent's lane; an id-less terminal closes nothing. RAW, ACTIVITY_*, REASONING_ENCRYPTED_VALUE and SUBAGENT_STARTED close nothing. Basis: spec streaming.mdx:128-150, plus TS chunks/transform.ts:401-456 (verified)."

