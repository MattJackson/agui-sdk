# AG-UI 1.0 compliance classification: one entry per row of requirements.md (rev 2).
# Edit by hand, keep IDs stable.
# Read by the traceability gate (crates/test-support/src/traceability.rs) together with
# docs/SPEC-MAP.md (test files) and pending.toml (rows still open).
# docs: in-repo files whose text documents the row; accepted as evidence for sdk-assistable rows only.
# class: sdk-ownable | sdk-assistable | application | informative
# role: client | server | both | n/a     scope: "1.0" (gate) or "draft-1.1" (not gated until 1.1 freezes)
# fixtures: names in spec/1.0/conformance/streams that genuinely exercise the row (for producer rows: must-refuse
#   inputs or producer-legal examples for the producer verifier; see README "Producer rows and fixtures").

schema_version = 1
ledger = "requirements.md"
spec = "docs/spec/1.0"

