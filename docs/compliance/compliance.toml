reason = "Implicit, both halves tested. Server: every runner event decodes identically from the SSE data payload and, with feature proto, from the protobuf frame (tests/processing_producer.rs); an HTTP run yields the same events and history over either binding (tests/transport_contract.rs). Client: the fast and middleware paths reach the same verdicts (tests/processing_order.rs), and the stream lane replays each expressible fixture over protobuf against the same expectations (tests/corpus_streams.rs). Byte parity itself is PB-12."

